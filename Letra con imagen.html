<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empareja letra con imagen</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="letra con imagen.css">


    <!-- Paisaje monocromático esmeralda -->
    <div class="paisaje" id="paisaje">
        <div class="cielo"></div>
        <div class="sol"></div>

        <div class="nube nube1"></div>
        <div class="nube nube2"></div>
        <div class="nube nube3"></div>
        <div class="nube nube4"></div>

        <div class="montaña1"></div>
        <div class="montaña2"></div>
        <div class="montaña3"></div>

        <div class="reflejo-sol"></div>

        <div class="agua">
            <div class="ola"></div>
            <div class="ola ola2"></div>
            <div class="brillo-agua"></div>
        </div>
    </div>

    <!-- Contenido del juego -->
    <div class="contenido">
        <h1 id="titleText">Empareja la letra con la imagen</h1>

        <div id="juego">
            <div id="letra"></div>
            <div class="opciones" id="opciones"></div>
            <div id="mensaje"></div>
            <div id="progreso"></div>
            <div class="barra-progreso">
                <div class="barra-progreso-relleno" id="barraRelleno"></div>
            </div>
        </div>

        <!-- Pantalla final -->
        <div id="pantallaFinal">
            <div id="finalTexto">¡Excelente!</div>
            <div id="finalEmoji">🏆</div>
            <button id="reiniciarBtn">Volver a jugar</button>
        </div>
    </div>

    <script src="letra con imagen.js"></script>
</body>
</html>
