<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Secuencias lógicas</title>

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="toca los elementos indicados.css">
</head>

<body>

    <!-- Paisaje sutil de fondo -->
    <div class="paisaje">
        <div class="sol"></div>
        <div class="nube nube-1"></div>
        <div class="nube nube-2"></div>
        <div class="nube nube-3"></div>
        
        <!-- Colinas lejanas (Lila) -->
        <svg class="colina colina-lejos" viewBox="0 0 1440 320" preserveAspectRatio="none">
            <path fill="#e8d8f8" fill-opacity="0.5" d="M0,256 C240,180 480,300 720,220 C960,140 1200,260 1440,200 L1440,320 L0,320 Z"></path>
        </svg>
        
        <!-- Colinas cercanas (Verde menta) -->
        <svg class="colina colina-cerca" viewBox="0 0 1440 320" preserveAspectRatio="none">
            <path fill="#c8f0d0" fill-opacity="0.45" d="M0,280 C360,220 720,310 1080,250 C1260,220 1440,280 1440,280 L1440,320 L0,320 Z"></path>
        </svg>
    </div>

    <!-- Blobs decorativos flotantes (Ajustados para no tapar las colinas) -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>

    <!-- Pequeñas decoraciones -->
    <div class="deco deco-1">✦</div>
    <div class="deco deco-2">♡</div>
    <div class="deco deco-3">✧</div>
    <div class="deco deco-4">⋆</div>
    <div class="deco deco-5">✿</div>
    <div class="deco deco-6">◈</div>

    <div class="juego">

        <h1>Secuencias lógicas</h1>

        <div class="nivel" id="nivelTxt">
            Nivel 1 de 20
        </div>

        <div class="caja-regla">

            <div class="titulo-regla">
                Instrucción
            </div>

            <div class="regla" id="reglaTxt">
                Apaga las luces
            </div>

        </div>

        <div class="progreso-iconos" id="iconosProgreso"></div>

        <div class="barra-objetivo-contenedor">
            <div class="barra-objetivo" id="progreso"></div>
        </div>

        <div class="tablero" id="tablero"></div>

    </div>

    <div id="mensajeAcierto" class="mensaje-acierto"></div>

    <div class="pantalla-final" id="final">

        <h2 id="mensajeFinal">
            ¡Muy bien!
        </h2>

        <p id="subMensajeFinal">
            Has completado el nivel
        </p>

        <button id="btnSiguiente">
            Continuar ➜
        </button>

    </div>

    <script src="toca los elementos indicados.js"></script>

</body>
</html>
